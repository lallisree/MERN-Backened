<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    //callback function
    const calculate = (a, b, callback) => {

     let result = a+b;

callback(result);

};

calculate(10, 20, (result) => {

console.log("Total:",result);


});

//promise
const checkNumber = (number) => {

return new Promise((resolve, reject) => {

if (number>10) {

resolve("Valid number");

} else {

reject("Invalid number");

}

});

};

checkNumber(20)

.then((result) => {

console.log(result);


})

.catch((error) => {

console.log(error);

});

//async/await
const verifyNumber = async () => {

try {

const result = await checkNumber(20);

// print result
console.log(result);


} catch (error) {

// print error
console.log(error);



}

};

verifyNumber();




</script>
<body>
    Using callback function
To check the output click the console

<h3>Promise syntax</h3>
<p>const promise = new Promise((resolve, reject) => {
<br>
    let success = true;<br>

    if (success) {<br>

        resolve("Success");<br>

    } else {<br>

        reject("Failed");<br>

    }<br>

});</p>

<h3>Async/Await</h3>
<p>const functionName = async () => {<br>

    const result = await promise;<br>

};</p>
    
</body>
</html>
