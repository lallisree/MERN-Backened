// DEPOSIT USING CLOSURE


function createAccount(){
  let balance=1000;
  function deposit(amount){
    balance+=amount;
    console.log("Deposited:",amount);
  }
  function getBalance(){
    console.log("Current Balance:",balance);
  }

  return {deposit,getBalance};
}
let account1 = createAccount();
account1.deposit(500)
account1.deposit(200)


account1.getBalance()


//PRIVATE COUNTER

function createCounter(){
  let count=0;
  function increment(){
    count++;
    console.log("Count:",count);
  }
  function decrement(){
    count--;
    console.log("Count:",count);
  }
  function getCount(){
    console.log("Current count:",count);
  }
  return {increment, decrement, getCount};
}
let counter = createCounter();
counter.increment();
counter.increment();
counter.increment();
counter.decrement();
counter.getCount();

//EMPLOYEE SALARY PRIVACY

function createEmployee(name, initialSalary) {
  let salary = initialSalary;

  return {
    getName() {
      return name;
    },

    getSalary() {
      return salary;
    },

    increaseSalary(amount) {
      if (amount < 0) {
      console.log("Salary increment can't be negative");
      }

      salary += amount;
      return salary;
    },
  };
}
let employee = createEmployee("Arun", 25000);

employee.increaseSalary(5000);

console.log(employee.getName());

console.log(employee.getSalary());
