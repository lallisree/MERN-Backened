<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    //print numbers from 1 to 10.

        for(x=1;x<=10;x++){
       console.log(x);
       }

    // even numbers from 1 to 20.

    for(x=1;x<=20;x++){
        if(x%2==0){
            console.log(x);
        }
    }

    //multiplication table of 5.

    for(x=1;x<=10;x++){
        console.log("5 * "+x+" = "+(5*x));
    }
    
    //pattern

      for(let x=1;x<=5;x++){
        let pattern="";
        for(let y=1;y<=x;y++){
            pattern+="*";
        }
        console.log(pattern);
      }

    //number pattern

    for(let x=1;x<=5;x++){
       let row="";
    for(let y=1;y<=x;y++){
         row+=y;
    }
     console.log(row);
    }

    //number reversed pattern

     for(let x=5;x>=1;x--){
       let row="";
     for(let y=5;y>=x;y--){
        row += y;
    }
    console.log(row);
     }


    </script>
    
</body>
</html>
