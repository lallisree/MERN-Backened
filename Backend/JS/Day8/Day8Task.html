    //9.using map and filter
    let marks = [45, 78, 32, 90, 67];
    let result=marks.map((mark)=>{
        return mark + 5;
    });
    let result1=marks.filter((mark)=>{  
      return mark > 50;
    });

    console.log("Marks added:",result);
